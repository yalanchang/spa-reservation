# 定時呼叫後端健康檢查：避免 Render 休眠、Aiven 免費資料庫因閒置被關機
# 也可以在 GitHub → Actions → Keep alive → Run workflow 手動執行
name: Keep alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫 /api/health
        # Render 休眠後喚醒要一分鐘左右，所以等久一點、失敗重試
        run: |
          curl --fail --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            https://spa-reservation.onrender.com/api/health
